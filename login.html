<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Miaucademy</title>
    
    <!-- Fontes do design -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Variáveis de cores do MiauCademy */
        :root {
            --roxo-claro: #bea6ff;
            --roxo-escuro: #8a3ffc;
            --roxo-mais-escuro: #2e174d;
            --laranja: #fe9503;
            --laranja-escuro: #ff6a00;
            --creme: #fff2df;
            --rosa: #ca148e;
            --preto-fundo: #0d051f;
            --branco: #ffffff;
            --cinza-claro: rgba(255, 255, 255, 0.8);
            --cinza-medio: rgba(255, 255, 255, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0d051f 0%, var(--roxo-mais-escuro) 30%, #1a0a35 70%, var(--roxo-escuro) 100%);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Container principal */
        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, var(--roxo-escuro), var(--roxo-mais-escuro));
            color: var(--creme);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--laranja), var(--roxo-claro));
        }
        
        .logo {
            margin-bottom: 20px;
        }
        
        .logo img {
            width: 120px;
            height: 120px;
            border-radius: 25px;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .logo img:hover {
            transform: scale(1.05);
        }
        
        .header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            color: var(--creme);
        }
        
        .tabs {
            display: flex;
            background: rgba(20, 10, 40, 0.9);
        }
        
        .tab-button {
            flex: 1;
            padding: 18px;
            text-align: center;
            background: transparent;
            color: var(--cinza-medio);
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .tab-button:hover {
            color: var(--branco);
            background: rgba(255, 255, 255, 0.05);
        }
        
        .tab-button.active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--laranja);
            font-weight: 700;
        }

        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--laranja), var(--roxo-claro));
        }
        
        .tab-content {
            padding: 40px 30px;
        }
        
        .form-container {
            display: none;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .form-container.active {
            display: block;
        }
        
        input {
            width: 100%;
            padding: 15px;
            margin: 12px 0;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 15px;
            color: var(--creme);
            transition: all 0.3s ease;
        }
        
        input::placeholder {
            color: var(--cinza-medio);
        }
        
        input:focus {
            border-color: var(--laranja);
            outline: none;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(254, 149, 3, 0.2);
        }
        
        button[type="submit"] {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--laranja), var(--laranja-escuro));
            color: var(--branco);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            margin-top: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(254, 149, 3, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        button[type="submit"]:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(254, 149, 3, 0.4);
            background: linear-gradient(135deg, var(--laranja-escuro), var(--laranja));
        }

        button[type="submit"]:active {
            transform: translateY(-1px);
        }
        
        /* Botão do Google */
        .google-btn-container {
            margin-top: 25px;
            text-align: center;
        }

        .google-btn {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--creme);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }
        
        .google-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--laranja);
            transform: translateY(-2px);
        }
        
        .message {
            padding: 12px 15px;
            margin: 15px 0;
            border-radius: 10px;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .error {
            background: linear-gradient(135deg, rgba(220, 53, 69, 0.2), rgba(245, 198, 203, 0.2));
            color: #ff6b6b;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }
        
        .success {
            background: linear-gradient(135deg, rgba(40, 167, 69, 0.2), rgba(32, 201, 151, 0.2));
            color: #51cf66;
            border: 1px solid rgba(40, 167, 69, 0.3);
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: var(--cinza-medio);
            font-size: 14px;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }
        
        .divider span {
            padding: 0 15px;
        }

        /* Estilo para o botão do Google Sign-in */
        .g_id_signin {
            margin-top: 15px;
            width: 100%;
        }

        .g_id_signin > div {
            width: 100% !important;
            border-radius: 50px !important;
            overflow: hidden;
        }
        
        @media (max-width: 600px) {
            .container {
                max-width: 100%;
            }
            
            .tab-button {
                padding: 15px 10px;
                font-size: 14px;
            }
            
            .tab-content {
                padding: 30px 20px;
            }

            .header {
                padding: 25px 15px;
            }

            .header h2 {
                font-size: 1.5rem;
            }

            .logo img {
                width: 100px;
                height: 100px;
            }
        }

        /* Efeito de brilho nos inputs */
        input:focus {
            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow {
            from {
                box-shadow: 0 0 5px rgba(254, 149, 3, 0.3), 0 0 10px rgba(254, 149, 3, 0.2);
            }
            to {
                box-shadow: 0 0 10px rgba(254, 149, 3, 0.4), 0 0 20px rgba(254, 149, 3, 0.3);
            }
        }

        /* Link para esquecer senha */
        .forgot-password {
            text-align: right;
            margin: 10px 0 20px 0;
        }

        .forgot-password a {
            color: var(--roxo-claro);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .forgot-password a:hover {
            color: var(--laranja);
            text-decoration: underline;
        }

        /* Ícones nos inputs */
        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--cinza-medio);
        }

        .input-with-icon input {
            padding-left: 45px;
        }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <img src="WhatsApp Image 2025-03-31 at 21.20.53.jpeg" alt="MiauCademy Logo" width="150">
            </div>
            <h2>Bem-vindo ao MiauCademy</h2>
            <p style="color: var(--cinza-medio); font-size: 0.9rem; margin-top: 5px;">Sua plataforma de estudos gamificada</p>
        </div>
        
        <div class="tabs">
            <button class="tab-button active" onclick="showTab('login')">
                <i class="fas fa-sign-in-alt"></i> Entrar
            </button>
            <button class="tab-button" onclick="showTab('register')">
                <i class="fas fa-user-plus"></i> Cadastrar
            </button>
        </div>
        
        <div class="tab-content">
            <!-- Formulário de Login -->
            <div id="login-form" class="form-container active">
                <form id="loginForm">
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="Usuário ou Email" required>
                    </div>
                    
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Senha" required>
                    </div>

                    <div class="forgot-password">
                        <a href="#" onclick="showForgotPassword()">Esqueceu a senha?</a>
                    </div>
                    
                    <div id="login-message" class="message"></div>
                    <button type="submit">
                        <i class="fas fa-sign-in-alt"></i> Entrar
                    </button>
                </form>
                
                <div class="divider">
                    <span>ou continue com</span>
                </div>

                <div class="google-btn-container">
                    <div id="g_id_onload" 
                         data-client_id="1060653026266-ddgvefd4hrrs7hgmojrkba198ulljmn2.apps.googleusercontent.com" 
                         data-context="signin" 
                         data-ux_mode="popup" 
                         data-callback="handleCredentialResponse" 
                         data-auto_prompt="false">
                    </div>
                    
                    <div class="g_id_signin" data-type="standard"></div>
                </div>
            </div>
            
            <!-- Formulário de Cadastro -->
            <div id="register-form" class="form-container">
                <form id="registerForm">
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="reg-name" placeholder="Nome completo" required>
                    </div>

                    <div class="input-with-icon">
                        <i class="fas fa-at"></i>
                        <input type="text" id="reg-username" placeholder="Nome de usuário" required>
                    </div>

                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="reg-email" placeholder="Email" required>
                    </div>

                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="reg-password" placeholder="Senha" required>
                    </div>

                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="reg-confirm-password" placeholder="Confirmar senha" required>
                    </div>
                    
                    <div id="register-message" class="message"></div>
                    <button type="submit">
                        <i class="fas fa-user-plus"></i> Criar Conta
                    </button>
                </form>

                <p style="color: var(--cinza-medio); font-size: 0.85rem; text-align: center; margin-top: 20px;">
                    Ao se cadastrar, você concorda com nossos <a href="#" style="color: var(--roxo-claro);">Termos de Uso</a> e <a href="#" style="color: var(--roxo-claro);">Política de Privacidade</a>.
                </p>
            </div>
        </div>
    </div>

    <script>
        // API do banco de dados
        const API_URL = 'https://projeto-principal-jgmr.onrender.com'; 
        
        // Funções de interface
        function showTab(tabName) {
            // Esconder todos os formulários
            document.querySelectorAll('.form-container').forEach(form => {
                form.classList.remove('active');
            });
            
            // Remover classe active de todos os botões
            document.querySelectorAll('.tab-button').forEach(button => {
                button.classList.remove('active');
            });
            
            // Mostrar o formulário selecionado
            document.getElementById(`${tabName}-form`).classList.add('active');
            
            // Ativar o botão selecionado
            event.target.classList.add('active');
        }
        
        // Função para esquecer senha
        function showForgotPassword() {
            const email = prompt("Digite seu email para redefinir a senha:");
            if (email) {
                axios.post(`${API_URL}/auth/forgot-password`, { email })
                    .then(response => {
                        alert("Email de redefinição enviado! Verifique sua caixa de entrada.");
                    })
                    .catch(error => {
                        alert("Erro ao enviar email de redefinição. Verifique o email digitado.");
                    });
            }
        }
        
        // Função para exibir mensagens
        function showMessage(elementId, message, type) {
            const messageElement = document.getElementById(elementId);
            messageElement.textContent = message;
            messageElement.className = `message ${type}`;
            messageElement.style.display = 'block';
            
            // Esconder a mensagem após 5 segundos
            setTimeout(() => {
                messageElement.style.display = 'none';
            }, 5000);
        }
        
        // Autenticação do Google
        function handleCredentialResponse(response) {
            console.log("Token JWT: ", response.credential);
            
            // Enviar token para o backend para verificação
            axios.post(`${API_URL}/auth/google`, {
                token: response.credential
            })
            .then(res => {
                // Armazena o token no localStorage
                localStorage.setItem("userToken", res.data.token);
                localStorage.setItem("userLoggedIn", "true");
                localStorage.setItem("username", res.data.username);
                
                // Mostrar mensagem de sucesso
                showMessage('login-message', 'Login com Google realizado com sucesso!', 'success');
                
                // Redirecionamento para tela inicial
                setTimeout(() => {
                    window.location.href = "https://kakaphl.github.io/Projeto-Principal/page.html"; 
                }, 1000);
            })
            .catch(error => {
                console.error("Erro na autenticação Google:", error);
                showMessage('login-message', 'Falha na autenticação com Google', 'error');
            });
        }
        
        // Autenticar por usuário e senha
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();
            
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            
            // Mostrar loading
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Entrando...';
            submitBtn.disabled = true;
            
            // Fazer requisição para a API de login
            axios.post(`${API_URL}/auth/login`, {
                username,
                password
            })
            .then(response => {
                // Login bem sucedido
                localStorage.setItem("userToken", response.data.token);
                localStorage.setItem("userLoggedIn", "true");
                localStorage.setItem("username", response.data.username);
                
                // Mostrar mensagem de sucesso
                showMessage('login-message', 'Login realizado com sucesso!', 'success');
                
                // Redirecionamento para tela inicial
                setTimeout(() => {
                    window.location.href = "https://kakaphl.github.io/Projeto-Principal/page.html";
                }, 1000);
            })
            .catch(error => {
                console.error("Erro no login:", error);
                showMessage('login-message', 'Usuário ou senha incorretos!', 'error');
                
                // Restaurar botão
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            });
        });
        
        // Cadastro de novo usuário
        document.getElementById("registerForm").addEventListener("submit", function(event) {
            event.preventDefault();
            
            const name = document.getElementById("reg-name").value;
            const username = document.getElementById("reg-username").value;
            const email = document.getElementById("reg-email").value;
            const password = document.getElementById("reg-password").value;
            const confirmPassword = document.getElementById("reg-confirm-password").value;
            
            // Mostrar loading
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Criando conta...';
            submitBtn.disabled = true;
            
            // Validação básica
            if (password !== confirmPassword) {
                showMessage('register-message', 'As senhas não coincidem!', 'error');
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
                return;
            }
            
            if (password.length < 6) {
                showMessage('register-message', 'A senha deve ter pelo menos 6 caracteres!', 'error');
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
                return;
            }
            
            // Fazer requisição para a API de cadastro
            axios.post(`${API_URL}/auth/register`, {
                name,
                username,
                email,
                password
            })
            .then(response => {
                showMessage('register-message', 'Cadastro realizado com sucesso! Você já pode fazer login.', 'success');
                
                // Limpar o formulário
                document.getElementById("registerForm").reset();
                
                // Restaurar botão
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
                
                // Mudar para a aba de login após 2 segundos
                setTimeout(() => {
                    showTab('login');
                }, 2000);
            })
            .catch(error => {
                console.error("Erro no cadastro:", error);
                const errorMsg = error.response?.data?.message || 'Erro ao realizar cadastro';
                showMessage('register-message', errorMsg, 'error');
                
                // Restaurar botão
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            });
        });
        
        // Verificar se o usuário já está logado
        window.addEventListener('DOMContentLoaded', () => {
            const userToken = localStorage.getItem("userToken");
            if (userToken) {
                // Verificar se o token ainda é válido
                axios.get(`${API_URL}/auth/verify`, {
                    headers: { 'Authorization': `Bearer ${userToken}` }
                })
                .then(response => {
                    // Se o token for válido, redirecionar para a página principal
                    window.location.href = "https://kakaphl.github.io/Projeto-Principal/page.html";
                })
                .catch(error => {
                    // Token inválido, remover do localStorage
                    localStorage.removeItem("userToken");
                    localStorage.removeItem("userLoggedIn");
                    localStorage.removeItem("username");
                });
            }

            // Adicionar animação nos inputs
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.style.transform = 'translateY(-2px)';
                });
                
                input.addEventListener('blur', function() {
                    this.parentElement.style.transform = 'translateY(0)';
                });
            });
        });
    </script>
</body>
</html>
