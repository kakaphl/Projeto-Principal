<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Define a codificação de caracteres como UTF-8 para suportar acentos e caracteres especiais -->
    <meta charset="UTF-8">
    <!-- Configura a viewport para responsividade em dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título da página exibido na aba do navegador -->
    <title>MiauCademy - Bem-vindo</title>
    
    <!-- Importa a fonte Montserrat do Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800;900&display=swap">
    
    <!-- Estilos CSS para a página -->
    <style>
        /* Remove margens e padding padrão do navegador e define a altura mínima da página */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Define estilos básicos para o corpo da página */
        body {
            font-family: 'Montserrat', sans-serif; /* Define a fonte padrão */
            line-height: 1.6; /* Define o espaçamento entre linhas */
            color: #fff2df; /* Define a cor do texto */
            background: linear-gradient(180deg, #8a3ffc 26.44%, #2e174d 56.25%, #ca148e); /* Gradiente de fundo */
            min-height: 100vh; /* Garante que o fundo ocupe pelo menos toda a altura da tela */
            display: flex; /* Usa flexbox para centralizar o conteúdo */
            justify-content: center; /* Centraliza horizontalmente */
            align-items: center; /* Centraliza verticalmente */
            padding: 20px; /* Adiciona espaçamento interno */
        }
        
        /* Container principal que centraliza o conteúdo */
        .container {
            max-width: 800px; /* Largura máxima do conteúdo */
            width: 100%; /* Ocupa toda a largura disponível */
            text-align: center; /* Centraliza o texto */
            padding: 40px; /* Espaçamento interno */
            background: rgba(255, 255, 255, 0.1); /* Fundo semi-transparente */
            border-radius: 20px; /* Bordas arredondadas */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); /* Sombra suave */
            backdrop-filter: blur(10px); /* Efeito de desfoque no fundo */
        }
        
        /* Estilo para o título principal */
        .main-title {
            font-size: 3.5rem; /* Tamanho da fonte responsivo */
            font-weight: 900; /* Peso da fonte (negrito) */
            margin-bottom: 20px; /* Espaçamento inferior */
            text-shadow: 0px 10px 15px rgba(79, 17, 172, 0.36); /* Sombra do texto */
            line-height: 1.2; /* Espaçamento entre linhas do título */
        }
        
        /* Estilo para o subtítulo */
        .subtitle {
            font-size: 1.5rem; /* Tamanho da fonte responsivo */
            font-weight: 400; /* Peso da fonte (normal) */
            margin-bottom: 40px; /* Espaçamento inferior */
            opacity: 0.9; /* Leve transparência */
        }
        
        /* Container para os botões de ação */
        .button-container {
            display: flex; /* Usa flexbox para layout */
            justify-content: center; /* Centraliza os botões horizontalmente */
            gap: 20px; /* Espaçamento entre os botões */
            margin-top: 40px; /* Espaçamento superior */
            flex-wrap: wrap; /* Permite que os botões quebrem linha em telas menores */
        }
        
        /* Estilo base para os botões */
        .btn {
            padding: 18px 40px; /* Espaçamento interno */
            border-radius: 50px; /* Bordas arredondadas */
            font-size: 1.2rem; /* Tamanho da fonte */
            font-weight: 800; /* Peso da fonte */
            cursor: pointer; /* Muda o cursor para indicar que é clicável */
            transition: all 0.3s ease; /* Transição suave para efeitos hover */
            text-decoration: none; /* Remove sublinhado de links */
            display: inline-block; /* Permite definir largura e altura */
            text-align: center; /* Centraliza o texto dentro do botão */
            min-width: 200px; /* Largura mínima dos botões */
            box-shadow: 0px 10px 20px rgba(52, 23, 97, 0.84); /* Sombra do botão */
            border: none; /* Remove borda padrão */
            outline: none; /* Remove contorno padrão */
        }
        
        /* Estilo específico para o botão de cadastro */
        .btn-primary {
            background-color: #bea6ff; /* Cor de fundo */
            color: #fdfdfd; /* Cor do texto */
        }
        
        /* Estilo específico para o botão de entrar */
        .btn-secondary {
            background-color: #f6f6f6; /* Cor de fundo */
            color: #8a3ffc; /* Cor do texto */
        }
        
        /* Efeito hover para os botões */
        .btn:hover {
            transform: translateY(-5px); /* Move o botão para cima ao passar o mouse */
            box-shadow: 0px 15px 25px rgba(52, 23, 97, 0.94); /* Aumenta a sombra ao passar o mouse */
        }
        
        /* Efeito de clique para os botões */
        .btn:active {
            transform: translateY(0); /* Retorna o botão à posição original ao clicar */
        }
        
        /* Estilo para a imagem decorativa (gato) */
        .cat-image {
            width: 200px; /* Largura da imagem */
            height: auto; /* Mantém a proporção da imagem */
            margin: 0 auto 30px; /* Centraliza e adiciona espaçamento inferior */
            display: block; /* Garante que a imagem seja exibida como bloco */
            filter: drop-shadow(0px 10px 15px rgba(79, 17, 172, 0.36)); /* Sombra da imagem */
        }
        
        /* Media query para telas menores (tablets) */
        @media (max-width: 768px) {
            .main-title {
                font-size: 2.5rem; /* Reduz o tamanho da fonte do título principal */
            }
            
            .subtitle {
                font-size: 1.2rem; /* Reduz o tamanho da fonte do subtítulo */
            }
            
            .btn {
                font-size: 1rem; /* Reduz o tamanho da fonte dos botões */
                padding: 15px 30px; /* Reduz o espaçamento interno dos botões */
            }
            
            .container {
                padding: 30px 20px; /* Reduz o espaçamento interno do container */
            }
        }
        
        /* Media query para telas muito pequenas (celulares) */
        @media (max-width: 480px) {
            .main-title {
                font-size: 2rem; /* Reduz ainda mais o tamanho da fonte do título principal */
            }
            
            .subtitle {
                font-size: 1rem; /* Reduz ainda mais o tamanho da fonte do subtítulo */
            }
            
            .btn {
                font-size: 0.9rem; /* Reduz ainda mais o tamanho da fonte dos botões */
                padding: 12px 25px; /* Reduz ainda mais o espaçamento interno dos botões */
                min-width: 160px; /* Reduz a largura mínima dos botões */
            }
            
            .button-container {
                flex-direction: column; /* Alinha os botões verticalmente */
                align-items: center; /* Centraliza os botões */
            }
            
            .cat-image {
                width: 150px; /* Reduz o tamanho da imagem em telas pequenas */
            }
        }
    </style>
</head>
<body>
    <!-- Container principal que envolve todo o conteúdo -->
    <div class="container">
        <!-- Imagem decorativa de um gato (ícone da MiauCademy) -->
        <svg class="cat-image" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- Cabeça do gato -->
            <circle cx="50" cy="40" r="30" fill="#fff2df" />
            <!-- Orelha esquerda -->
            <polygon points="35,15 45,30 25,30" fill="#fff2df" />
            <!-- Orelha direita -->
            <polygon points="65,15 75,30 55,30" fill="#fff2df" />
            <!-- Olho esquerdo -->
            <circle cx="40" cy="35" r="5" fill="#8a3ffc" />
            <!-- Olho direito -->
            <circle cx="60" cy="35" r="5" fill="#8a3ffc" />
            <!-- Nariz -->
            <polygon points="50,45 45,50 55,50" fill="#ca148e" />
            <!-- Boca -->
            <path d="M45,55 Q50,60 55,55" stroke="#ca148e" stroke-width="2" fill="none" />
            <!-- Bigodes -->
            <line x1="30" y1="45" x2="40" y2="48" stroke="#8a3ffc" stroke-width="2" />
            <line x1="30" y1="50" x2="40" y2="50" stroke="#8a3ffc" stroke-width="2" />
            <line x1="30" y1="55" x2="40" y2="52" stroke="#8a3ffc" stroke-width="2" />
            <line x1="70" y1="45" x2="60" y2="48" stroke="#8a3ffc" stroke-width="2" />
            <line x1="70" y1="50" x2="60" y2="50" stroke="#8a3ffc" stroke-width="2" />
            <line x1="70" y1="55" x2="60" y2="52" stroke="#8a3ffc" stroke-width="2" />
        </svg>
        
        <!-- Título principal da página -->
        <h1 class="main-title">Bem-vindo ao MiauCademy</h1>
        
        <!-- Subtítulo da página -->
        <p class="subtitle">Seu ambiente de estudos nunca foi tão divertido!</p>
        
        <!-- Container para os botões de ação -->
        <div class="button-container">
            <!-- Botão para cadastro (leva para a página de cadastro) -->
            <a href="page.html" class="btn btn-primary">COMEÇAR AGORA</a>
            <!-- Botão para login (leva para a página de login) -->
            <a href="login.html" class="btn btn-secondary">ENTRAR</a>
        </div>
    </div>

    <!-- Script JavaScript para funcionalidades adicionais -->
    <script>
        // Aguarda o carregamento completo da página antes de executar o código
        document.addEventListener('DOMContentLoaded', function() {
            // Seleciona todos os botões da página
            const buttons = document.querySelectorAll('.btn');
            
            // Adiciona um evento de clique para cada botão
            buttons.forEach(button => {
                button.addEventListener('click', function() {
                    // Adiciona uma animação de clique
                    this.style.transform = 'scale(0.95)';
                    
                    // Remove a animação após um breve período
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 150);
                });
            });
            
            // Adiciona um efeito de digitação ao título (opcional)
            const title = document.querySelector('.main-title');
            const originalText = title.textContent;
            title.textContent = '';
            
            let i = 0;
            const typeWriter = () => {
                if (i < originalText.length) {
                    title.textContent += originalText.charAt(i);
                    i++;
                    setTimeout(typeWriter, 100);
                }
            };
            
            // Inicia o efeito de digitação após um breve delay
            setTimeout(typeWriter, 500);
        });
    </script>
</body>
</html>
